name: Durata Therapeutics
description: Durata Therapeutics was a clinical-stage pharmaceutical company founded in 2009 around anti-infective
  assets acquired from Pfizer's Vicuron division, headquartered first in Morristown, New Jersey and from 2012
  in Chicago, Illinois. Its lead candidate was dalbavancin, a long-acting semisynthetic lipoglycopeptide
  antibiotic taken into Phase III trials from 2011 for acute bacterial skin and skin-structure infections and
  later marketed as Dalvance. The company was backed by Canaan Partners and was acquired by Actavis (now
  Allergan) on November 17, 2014 for approximately $675 million, at which point it ceased to operate as an
  independent entity. Durata Therapeutics published no developer program, no public API, and no machine-readable
  API artifacts; its corporate domain duratatherapeutics.com no longer resolves. This profile is retained as a
  historical company record in the API Evangelist network.
